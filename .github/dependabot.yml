version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/controlplane
    schedule:
      interval: weekly
      day: monday
    groups:
      controlplane-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    groups:
      sdk-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /services/controlplane
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
