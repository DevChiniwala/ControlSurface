name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/controlplane/pyproject.toml
            sdk/python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python packages
        run: python -m pip install -e 'services/controlplane[dev]' -e 'sdk/python[dev]'
      - name: Check independent-project naming
        shell: bash
        run: |
          for token in "$(printf '%s%s' 'open' 'lit')" "$(printf '%s%s' 'lam' 'inar')"; do
            if git grep -I -n -i "$token" -- .; then
              echo "Reference-project text found in tracked public files."
              exit 1
            fi
          done
      - name: Lint and format Python
        run: |
          python -m ruff check services/controlplane sdk/python examples/refund_agent tests
          python -m ruff format --check services/controlplane sdk/python examples/refund_agent tests
      - name: Type-check backend and SDK
        run: python -m mypy services/controlplane/src sdk/python/src --ignore-missing-imports
      - name: Backend and SDK tests
        run: python -m pytest -q services/controlplane/tests sdk/python/tests
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Type-check web
        run: npm run typecheck --prefix apps/web
      - name: Lint web
        run: npm run lint --prefix apps/web
      - name: Check web formatting
        run: npm run format:check --prefix apps/web
      - name: Build web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build --prefix apps/web

  hero-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/controlplane/pyproject.toml
            sdk/python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install test packages
        run: python -m pip install -e 'services/controlplane[dev]' -e 'sdk/python[dev]'
      - name: Install browser test dependencies
        run: |
          npm ci --prefix apps/web
          cd apps/web && npx playwright install --with-deps chromium
      - name: Create disposable stack credentials
        shell: bash
        run: |
          echo "CS_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CS_CH_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CS_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for API and web
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null &&
               curl --fail --silent http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=100
          exit 1
      - name: Validate migrations are idempotent
        run: docker compose run --rm migrate
      - name: Seed and verify the real-service hero workflow
        env:
          CONTROLSURFACE_E2E: "1"
          CONTROLSURFACE_API_URL: http://localhost:8000
          CONTROLSURFACE_OTLP_URL: http://localhost:4318
          CONTROLSURFACE_WEB_URL: http://localhost:3000
        run: python -m pytest -q tests/e2e/test_hero_workflow.py::test_failure_to_reproducible_release_decision -s
      - name: Verify authenticated browser workflow
        env:
          CONTROLSURFACE_BROWSER_E2E: "1"
          CONTROLSURFACE_API_URL: http://localhost:8000
          CONTROLSURFACE_WEB_URL: http://localhost:3000
        run: npm run test:e2e --prefix apps/web
      - name: Verify login throttling
        env:
          CONTROLSURFACE_E2E: "1"
          CONTROLSURFACE_API_URL: http://localhost:8000
        run: python -m pytest -q tests/e2e/test_hero_workflow.py::test_login_rate_limit_on_seeded_stack -s
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
