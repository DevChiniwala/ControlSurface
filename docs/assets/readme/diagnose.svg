<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic failure intelligence</title>
  <desc id="desc">Many failed agent runs are grouped into a small set of inspectable structural failure clusters and ranked change evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#456B9D"/></marker></defs>
  <rect width="1200" height="330" rx="18" fill="#050912"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="54" y="52" fill="#F7F9FC" font-size="20" font-weight="700">Inspect patterns, not thousands of failures.</text>
    <text x="54" y="77" fill="#7F8DA4" font-size="13">Structural features remain visible and representative runs remain one click away.</text>
    <g transform="translate(54 112)"><rect width="270" height="166" rx="11" fill="#0B1424" stroke="#253B5A"/><text x="22" y="31" fill="#F7F9FC" font-size="15" font-weight="700">Failed run population</text><g fill="#F08A7D"><circle cx="33" cy="62" r="5"/><circle cx="55" cy="62" r="5"/><circle cx="77" cy="62" r="5"/><circle cx="99" cy="62" r="5"/><circle cx="121" cy="62" r="5"/><circle cx="143" cy="62" r="5"/><circle cx="165" cy="62" r="5"/><circle cx="187" cy="62" r="5"/><circle cx="209" cy="62" r="5"/><circle cx="231" cy="62" r="5"/></g><g fill="#C76363"><circle cx="33" cy="85" r="5"/><circle cx="55" cy="85" r="5"/><circle cx="77" cy="85" r="5"/><circle cx="99" cy="85" r="5"/><circle cx="121" cy="85" r="5"/><circle cx="143" cy="85" r="5"/><circle cx="165" cy="85" r="5"/><circle cx="187" cy="85" r="5"/><circle cx="209" cy="85" r="5"/><circle cx="231" cy="85" r="5"/></g><text x="22" y="127" fill="#8F9DB3" font-size="12">tool · exception · sequence</text><text x="22" y="147" fill="#8F9DB3" font-size="12">retry · outcome · stop reason</text></g>
    <path d="M342 195H432" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(450 112)"><rect width="296" height="166" rx="11" fill="#0B1424" stroke="#2F5D99"/><text x="22" y="31" fill="#35C2FF" font-size="11" font-weight="700" letter-spacing="1.3">FAILURE CLUSTERS</text><g font-size="12"><rect x="22" y="49" width="252" height="29" rx="6" fill="#15243B"/><text x="35" y="68" fill="#DCE7F8">Tool contract mismatch</text><circle cx="251" cy="63" r="4" fill="#35C2FF"/><rect x="22" y="87" width="252" height="29" rx="6" fill="#15243B"/><text x="35" y="106" fill="#DCE7F8">Planning loop</text><circle cx="251" cy="101" r="4" fill="#247CFF"/><rect x="22" y="125" width="252" height="29" rx="6" fill="#15243B"/><text x="35" y="144" fill="#DCE7F8">Timeout / retries</text><circle cx="251" cy="139" r="4" fill="#73B6FF"/></g></g>
    <path d="M764 195H836" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(854 112)"><rect width="292" height="166" rx="11" fill="#10203A" stroke="#247CFF"/><text x="22" y="31" fill="#35C2FF" font-size="11" font-weight="700" letter-spacing="1.3">INSPECTABLE EVIDENCE</text><text x="22" y="64" fill="#F7F9FC" font-size="14" font-weight="700">Representative execution</text><text x="22" y="88" fill="#8F9DB3" font-size="12">Exact failed step and context</text><text x="22" y="116" fill="#F7F9FC" font-size="14" font-weight="700">Ranked nearby changes</text><text x="22" y="140" fill="#8F9DB3" font-size="12">Association score, never causal proof</text></g>
  </g>
</svg>
