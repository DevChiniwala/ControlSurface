<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-backed release gate</title>
  <desc id="desc">A candidate is compared with a production baseline across quality, latency, cost, tool accuracy, and critical cases before a pass or block decision.</desc>
  <rect width="1200" height="360" rx="18" fill="#050912"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="54" y="49" fill="#F7F9FC" font-size="20" font-weight="700">Make the release decision reproducible.</text>
    <text x="54" y="74" fill="#7F8DA4" font-size="13">The full manifest and individual results are pinned under a content hash.</text>
    <g transform="translate(54 110)"><rect width="255" height="190" rx="11" fill="#0B1424" stroke="#253B5A"/><text x="22" y="31" fill="#7F8DA4" font-size="11" font-weight="700" letter-spacing="1.3">BASELINE</text><text x="22" y="64" fill="#F7F9FC" font-size="16" font-weight="700">Production version</text><text x="22" y="98" fill="#8F9DB3" font-size="12">Suite revision</text><text x="22" y="121" fill="#8F9DB3" font-size="12">Evaluator versions</text><text x="22" y="144" fill="#8F9DB3" font-size="12">Prompt + tool schema hashes</text><text x="22" y="167" fill="#8F9DB3" font-size="12">Model configuration</text></g>
    <text x="350" y="210" fill="#35C2FF" font-size="22" font-weight="700">vs</text>
    <g transform="translate(400 110)"><rect width="255" height="190" rx="11" fill="#10203A" stroke="#247CFF"/><text x="22" y="31" fill="#35C2FF" font-size="11" font-weight="700" letter-spacing="1.3">CANDIDATE</text><text x="22" y="64" fill="#F7F9FC" font-size="16" font-weight="700">Proposed version</text><text x="22" y="98" fill="#8F9DB3" font-size="12">Same cases</text><text x="22" y="121" fill="#8F9DB3" font-size="12">Same evaluator contract</text><text x="22" y="144" fill="#8F9DB3" font-size="12">Measured deltas</text><text x="22" y="167" fill="#8F9DB3" font-size="12">Individual case results</text></g>
    <g transform="translate(704 110)"><rect width="254" height="190" rx="11" fill="#0B1424" stroke="#253B5A"/><text x="22" y="31" fill="#7F8DA4" font-size="11" font-weight="700" letter-spacing="1.3">GATE POLICY</text><g font-size="13"><text x="22" y="65" fill="#DCE7F8">Quality</text><text x="226" y="65" text-anchor="end" fill="#7FE2BE">PASS</text><text x="22" y="94" fill="#DCE7F8">Latency</text><text x="226" y="94" text-anchor="end" fill="#7FE2BE">PASS</text><text x="22" y="123" fill="#DCE7F8">Cost</text><text x="226" y="123" text-anchor="end" fill="#7FE2BE">PASS</text><text x="22" y="152" fill="#DCE7F8">Tool accuracy</text><text x="226" y="152" text-anchor="end" fill="#F29A96">FAIL</text><text x="22" y="177" fill="#8F9DB3">Critical cases included</text></g></g>
    <g transform="translate(996 110)"><rect width="150" height="190" rx="11" fill="#2B1519" stroke="#884750"/><circle cx="75" cy="51" r="22" fill="#3A1B21"/><path d="M66 42l18 18M84 42L66 60" stroke="#F29A96" stroke-width="3"/><text x="75" y="97" text-anchor="middle" fill="#F29A96" font-size="15" font-weight="800">RELEASE</text><text x="75" y="120" text-anchor="middle" fill="#F29A96" font-size="15" font-weight="800">BLOCKED</text><text x="75" y="158" text-anchor="middle" fill="#A8B4C8" font-size="11">Evidence retained</text></g>
  </g>
</svg>
