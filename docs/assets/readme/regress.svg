<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Production-derived regression workflow</title>
  <desc id="desc">An incident yields a representative execution, an editable regression candidate, human review, and a revisioned regression suite.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#456B9D"/></marker></defs>
  <rect width="1200" height="300" rx="18" fill="#050912"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="54" y="49" fill="#F7F9FC" font-size="20" font-weight="700">Production failures become durable engineering knowledge.</text>
    <text x="54" y="74" fill="#7F8DA4" font-size="13">ControlSurface proposes representative cases; an engineer reviews the expected behavior.</text>
    <g transform="translate(54 117)"><rect width="180" height="106" rx="10" fill="#0B1424" stroke="#77454C"/><path d="M22 25l10 18H12Z" fill="none" stroke="#F08A7D" stroke-width="2"/><text x="47" y="34" fill="#F7F9FC" font-size="14" font-weight="700">Incident</text><text x="18" y="68" fill="#8F9DB3" font-size="12">Failure cluster</text><text x="18" y="88" fill="#8F9DB3" font-size="12">Impact + evidence</text></g>
    <path d="M246 170H286" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(300 117)"><rect width="190" height="106" rx="10" fill="#0B1424" stroke="#27456F"/><path d="M18 24h24v22H18zM23 31h14M23 38h9" fill="none" stroke="#35C2FF" stroke-width="2"/><text x="54" y="34" fill="#F7F9FC" font-size="14" font-weight="700">Representative run</text><text x="18" y="68" fill="#8F9DB3" font-size="12">Input and context</text><text x="18" y="88" fill="#8F9DB3" font-size="12">Tool path + outcome</text></g>
    <path d="M502 170H542" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(556 117)"><rect width="190" height="106" rx="10" fill="#0B1424" stroke="#27456F"/><path d="M18 24h24v22H18zM23 31h14M23 38h14" fill="none" stroke="#73B6FF" stroke-width="2"/><text x="54" y="34" fill="#F7F9FC" font-size="14" font-weight="700">Editable candidate</text><text x="18" y="68" fill="#8F9DB3" font-size="12">Required tools</text><text x="18" y="88" fill="#8F9DB3" font-size="12">Assertions + limits</text></g>
    <path d="M758 170H798" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(812 117)"><rect width="142" height="106" rx="10" fill="#10203A" stroke="#247CFF"/><circle cx="28" cy="33" r="12" fill="#143362"/><path d="M22 33l4 4 8-10" fill="none" stroke="#35C2FF" stroke-width="2"/><text x="50" y="37" fill="#F7F9FC" font-size="14" font-weight="700">Review</text><text x="18" y="75" fill="#8F9DB3" font-size="12">Human accepted</text></g>
    <path d="M966 170H1006" stroke="#456B9D" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1020 117)"><rect width="126" height="106" rx="10" fill="#112445" stroke="#247CFF"/><path d="M18 24h20v24H18zM23 18h20v24" fill="none" stroke="#35C2FF" stroke-width="2"/><text x="53" y="37" fill="#F7F9FC" font-size="14" font-weight="700">Suite</text><text x="18" y="75" fill="#A9B8CF" font-size="12">Revisioned</text><text x="18" y="94" fill="#A9B8CF" font-size="12">Source-linked</text></g>
  </g>
</svg>
