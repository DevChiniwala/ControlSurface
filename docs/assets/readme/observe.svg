<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Agent-aware telemetry</title>
  <desc id="desc">Raw OpenTelemetry spans are preserved while a separate AgentRunGraph normalizes agent, model, tool, retrieval, retry, and outcome nodes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#3C638F"/></marker></defs>
  <rect width="1200" height="330" rx="18" fill="#050912"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="54" y="52" fill="#F7F9FC" font-size="20" font-weight="700">Preserve the source. Derive agent semantics.</text>
    <text x="54" y="77" fill="#7F8DA4" font-size="13">ControlSurface does not replace OTLP with a proprietary-only event model.</text>
    <g transform="translate(54 111)"><rect width="260" height="154" rx="11" fill="#0B1424" stroke="#253B5A"/><text x="24" y="32" fill="#35C2FF" font-size="11" font-weight="700" letter-spacing="1.5">SOURCE TELEMETRY</text><text x="24" y="63" fill="#F7F9FC" font-size="16" font-weight="700">OTLP spans</text><text x="24" y="87" fill="#8F9DB3" font-size="12">HTTP + gRPC ingestion</text><text x="24" y="109" fill="#8F9DB3" font-size="12">Trace and span IDs retained</text><text x="24" y="131" fill="#8F9DB3" font-size="12">Attributes remain inspectable</text></g>
    <path d="M330 188H432" stroke="#3C638F" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(450 134)"><rect width="214" height="108" rx="54" fill="#102445" stroke="#247CFF"/><text x="107" y="49" text-anchor="middle" fill="#F7F9FC" font-size="14" font-weight="700">Normalization</text><text x="107" y="72" text-anchor="middle" fill="#86A8D8" font-size="12">versioned projection</text></g>
    <path d="M682 188H760" stroke="#3C638F" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(778 103)"><rect width="368" height="170" rx="11" fill="#0B1424" stroke="#2F5D99"/><text x="24" y="32" fill="#35C2FF" font-size="11" font-weight="700" letter-spacing="1.5">AGENTRUNGRAPH</text>
      <g font-size="12"><rect x="24" y="52" width="88" height="31" rx="6" fill="#112445"/><text x="68" y="72" text-anchor="middle" fill="#DCE7F8">agent</text><rect x="122" y="52" width="88" height="31" rx="6" fill="#112445"/><text x="166" y="72" text-anchor="middle" fill="#DCE7F8">model</text><rect x="220" y="52" width="88" height="31" rx="6" fill="#112445"/><text x="264" y="72" text-anchor="middle" fill="#DCE7F8">tool</text><rect x="24" y="94" width="88" height="31" rx="6" fill="#112445"/><text x="68" y="114" text-anchor="middle" fill="#DCE7F8">retrieval</text><rect x="122" y="94" width="88" height="31" rx="6" fill="#112445"/><text x="166" y="114" text-anchor="middle" fill="#DCE7F8">retry</text><rect x="220" y="94" width="88" height="31" rx="6" fill="#112445"/><text x="264" y="114" text-anchor="middle" fill="#DCE7F8">sub-agent</text><text x="24" y="151" fill="#7F8DA4">Branches · state transitions · outcomes</text></g>
    </g>
  </g>
</svg>
