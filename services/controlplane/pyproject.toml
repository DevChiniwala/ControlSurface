[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlsurface-server"
version = "0.1.0"
description = "ControlSurface control plane and telemetry processing"
authors = [{ name = "Dev Chiniwala" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "clickhouse-connect>=0.8,<1",
  "opentelemetry-proto>=1.30,<2",
  "protobuf>=5,<8",
  "grpcio>=1.70,<2",
  "argon2-cffi>=23,<26",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/controlsurface_server/api.py" = ["B008"]
"src/controlsurface_server/workflows.py" = ["B008"]
