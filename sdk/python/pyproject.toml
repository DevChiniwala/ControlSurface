[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlsurface"
version = "0.1.0"
description = "Fail-safe Python telemetry SDK for ControlSurface"
authors = [{ name = "Dev Chiniwala" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "jsonschema>=4.23,<5",
]

[project.scripts]
controlsurface = "controlsurface.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
